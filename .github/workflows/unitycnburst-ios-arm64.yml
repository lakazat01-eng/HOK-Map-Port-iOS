name: Build UnityCNBurst for jailbroken iPhone (arm64)

on:
  push:
    branches:
      - tools/unitycnburst-ios-arm64
    paths:
      - .github/workflows/unitycnburst-ios-arm64.yml

permissions:
  contents: read

jobs:
  build-ios-arm64:
    runs-on: macos-14
    steps:
      - name: Checkout workspace
        uses: actions/checkout@v4

      - name: Install Zig 0.15.2
        uses: mlugg/setup-zig@v2
        with:
          version: 0.15.2

      - name: Install ldid
        shell: bash
        run: |
          set -euo pipefail
          brew install ldid
          ldid --version || true

      - name: Checkout upstream UnityCNBurst
        uses: actions/checkout@v4
        with:
          repository: AXiX-official/UnityCNBurst
          ref: master
          path: upstream/UnityCNBurst

      - name: Prepare Zig iOS system library
        shell: bash
        run: |
          set -euo pipefail
          IOS_SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          LIBSYSTEM="$IOS_SDK/usr/lib/libSystem.tbd"
          test -f "$LIBSYSTEM" || { echo "::error::Missing $LIBSYSTEM"; exit 1; }

          ZIG_BIN="$(python3 -c 'import os,shutil; print(os.path.realpath(shutil.which("zig")))')"
          ZIG_ROOT="$(cd "$(dirname "$ZIG_BIN")" && pwd)"
          ZIG_LIB_DIR="$ZIG_ROOT/lib"
          test -d "$ZIG_LIB_DIR" || { echo "::error::Zig lib directory not found: $ZIG_LIB_DIR"; exit 1; }

          mkdir -p "$ZIG_LIB_DIR/libc/darwin"
          cp "$LIBSYSTEM" "$ZIG_LIB_DIR/libc/darwin/libSystem.tbd"
          echo "Zig binary: $ZIG_BIN"
          echo "Zig library directory: $ZIG_LIB_DIR"
          ls -l "$ZIG_LIB_DIR/libc/darwin/libSystem.tbd"

      - name: Build, ldid-sign, and inspect iOS executables
        working-directory: upstream/UnityCNBurst
        shell: bash
        run: |
          set -euo pipefail
          ZIG_BIN="$(python3 -c 'import os,shutil; print(os.path.realpath(shutil.which("zig")))')"
          ZIG_ROOT="$(cd "$(dirname "$ZIG_BIN")" && pwd)"
          ZIG_LIB_DIR="$ZIG_ROOT/lib"
          echo "Zig: $("$ZIG_BIN" version)"
          mkdir -p dist

          # Build the actual scanner for physical iOS arm64.
          "$ZIG_BIN" build-exe src/main.zig -O ReleaseFast -target aarch64-ios \
            -L "$ZIG_LIB_DIR/libc/darwin" \
            -femit-bin=dist/UnityCNBurst

          # Zig-built smoke test.
          cat > smoke.zig <<'ZIG'
          const std = @import("std");
          pub fn main() void {
              std.debug.print("Zig iOS arm64 smoke OK\\n", .{});
          }
          ZIG
          "$ZIG_BIN" build-exe smoke.zig -O ReleaseFast -target aarch64-ios \
            -L "$ZIG_LIB_DIR/libc/darwin" \
            -femit-bin=dist/ios-smoke

          # Independent reference executable built by Apple's iPhoneOS SDK.
          # If this runs but the Zig one does not, the Zig-produced Mach-O is
          # the differentiator; if both are killed, inspect device signing/AMFI.
          cat > smoke.c <<'C'
          #include <unistd.h>
          int main(void) {
              const char msg[] = "Apple Clang iOS arm64 smoke OK\\n";
              return (write(1, msg, sizeof(msg) - 1) < 0) ? 1 : 0;
          }
          C
          xcrun --sdk iphoneos clang -arch arm64 -miphoneos-version-min=14.0 \
            -O2 smoke.c -o dist/clang-smoke

          # Pseudo-sign all binaries for a jailbroken device.
          ldid -S dist/UnityCNBurst
          ldid -S dist/ios-smoke
          ldid -S dist/clang-smoke

          echo "=== MACH-O ==="
          file dist/UnityCNBurst dist/ios-smoke dist/clang-smoke
          for BIN in dist/UnityCNBurst dist/ios-smoke dist/clang-smoke; do
            echo "=== $BIN load commands ==="
            otool -l "$BIN" | grep -A5 -E 'LC_BUILD_VERSION|LC_VERSION_MIN_IPHONEOS|LC_CODE_SIGNATURE' || true
            echo "=== $BIN ldid CDHash ==="
            ldid -h "$BIN"
            echo "=== $BIN codesign details ==="
            codesign -dv --verbose=2 "$BIN" 2>&1 || true
          done
          shasum -a 256 dist/UnityCNBurst dist/ios-smoke dist/clang-smoke

          cat > dist/README.txt <<'TXT'
          UnityCNBurst iOS arm64 test package

          TEST ORDER:
          1. ./clang-smoke  -> Apple Clang reference binary
          2. ./ios-smoke    -> Zig-built reference binary
          3. ./UnityCNBurst -> scanner usage without arguments

          If clang-smoke runs but ios-smoke is killed, investigate Zig's Mach-O.
          If both smoke tests are killed, investigate device-side signing/AMFI.
          Do not run the metadata scan until the scanner prints Usage correctly.
          TXT

      - name: Upload iOS arm64 diagnostic package
        uses: actions/upload-artifact@v4
        with:
          name: UnityCNBurst-ios-arm64-signed-diagnostics
          path: upstream/UnityCNBurst/dist/
          if-no-files-found: error
          retention-days: 7
